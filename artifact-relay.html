<!doctype html>
<meta charset="utf-8">
<title>Queue compatibility report</title>
<p id="status">Opening compatibility report...</p>
<script>
(async () => {
  const status = document.querySelector('#status');
  const match = location.hash.match(/^#([0-9]{2,5})\/([0-9a-f-]{36})$/i);
  if (!match) {
    status.textContent = 'Queue compatibility: unavailable';
    return;
  }
  const port = Number(match[1]);
  const conversation = match[2];
  const candidates = [
    'http://127.0.0.1:' + port,
    'http://localhost:' + port
  ];
  for (const base of candidates) {
    try {
      const root = await fetch(base + '/', {
        method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store'
      });
      const rootText = await root.text();
      let csrf = '';
      try { csrf = JSON.parse(rootText).csrfToken || ''; } catch (_) {}
      if (!csrf) {
        const token = rootText.match(/"csrfToken"\s*:\s*"((?:\\.|[^"\\])*)"/i);
        if (token) csrf = JSON.parse('"' + token[1] + '"');
      }
      if (!root.ok || !csrf) continue;
      location.replace(
        base + '/static/artifacts/' + encodeURIComponent(conversation) +
        '/compatibility-report.html?csrf=' + encodeURIComponent(csrf)
      );
      return;
    } catch (_) {}
  }
  status.textContent = 'Queue compatibility: unavailable';
})();
</script>
